<!DOCTYPE html>
<html lang="en" class="bg-primary">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="public/trote.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Trote Solidário</title>
</head>
<body class="h-dvh flex justify-center items-center">
    <div id="card-wrapper">
        <div id="card-top" class="flex flex-col rounded-t-xl items-center gap-2 bg-secondary px-6 py-4">
            <img src="public/unifacef-logo.png" class="sm:h-20 h-16" alt="">
        </div>
        <div id="card-main" class="bg-bgd px-6 py-4 flex flex-col gap-4 rounded-b-xl">
            <div id="texts-wrapper">
                <h1 class="text-text-primary text-center sm:text-4xl text-3xl font-bold tracking-wider font-[Fredoka]">Trote Solidário 2026</h1>
                <p class="text-text-primary text-center font-[Poppins] sm:text-lg">O maior evento solidário da região!</p>
            </div>
            <div id="img-wrapper" class="flex justify-center">
                <img src="public/trote.png" alt="" class="rounded-lg">
            </div>
            <div id="list-wrapper" class="flex flex-col justify-center items-center text-text-primary gap-2">
                <h2 class="font-[Poppins] sm:text-xl">O que teremos:</h2>
                <ul class="font-[Poppins] sm:text-lg flex flex-col items-center justify-center gap-1.5">
                    <li>🚀 Doações</li>
                    <div class="w-full h-0.5 bg-line"></div>
                    <li>☕ Gincanas</li>
                    <div class="w-full h-0.5 bg-line"></div> 
                    <li>🎨 Ação Social</li>
                    <!-- LINES FEITAS COM DIVS PARA SUAVIZAR A ANIMAÇÃO DO TRANSLATE. ESTILO COM AFTER NO CSS. -->
                </ul>
            </div>
            <div id="cta-wrapper" class="self-center p-4">
                <button id="cta" class="px-6 py-3 font-[Nunito] bg-cta active:bg-cta-dark active:scale-90 transition-all duration-150 text-bgd font-bold hover:-translate-y-1 hover:scale-110 text-xl rounded-full">Vou participar</button>
            </div>
        </div>
    </div>
</body>
</html>
